services:
  puffer-webrtc:
    build: .
    # Host networking: WebRTC advertises the host's real IPs and the UDP port
    # needs no Docker NAT/port mapping (only works on Linux hosts).
    network_mode: host
    restart: unless-stopped
    environment:
      PUFFER_HTTP_ADDR: ":8080"
      PUFFER_UDP_PORT: "50000"
      # Cloud VMs (AWS/GCP/Azure) whose public IP is not on an interface:
      # PUFFER_PUBLIC_IP: "203.0.113.10"
      # Videos the page can pick from and upload to (kept on the host in ./videos).
      PUFFER_MEDIA_DIR: "/app/videos"
      # PUFFER_ALLOW_UPLOAD: "false"
      # PUFFER_VIDEO: "/app/media/your-video.mp4"
      # PUFFER_MAX_BITRATE: "6000000"
      # Shared simulcast source (e.g. the sfu-test transcoder sending to these ports on this host):
      # PUFFER_SIMULCAST: "high=127.0.0.1:5001@2500k,mid=127.0.0.1:5002@800k,low=127.0.0.1:5003@250k"
    volumes:
      - ./logs:/app/logs
      - ./videos:/app/videos
      # - ./media/your-video.mp4:/app/media/your-video.mp4:ro

  # One-way delay over WebTransport for the downlink page's chart (UDP and TCP 4433).
  # Standalone: the same image can run on any other host (see owdserver/Dockerfile).
  owdserver:
    build: ./owdserver
    network_mode: host
    restart: unless-stopped
    environment:
      PUFFER_OWD_ADDR: ":4433"
      # A CA-issued certificate for this host instead of the rotating self-signed one:
      # PUFFER_OWD_TLS_CERT: "/certs/fullchain.pem"
      # PUFFER_OWD_TLS_KEY: "/certs/privkey.pem"
